# Split deployment for zwave-ui:
# - The backend is stock zwave-js-ui and is the only container that touches the
#   Z-Wave USB stick.
# - The frontend is a pure same-origin reverse-proxy client for the SPA, /api,
#   /health, /version, and /socket.io websocket traffic.
# - The stock zwave-js-ui UI remains reachable on BACKEND_PORT (default :8091).
#   Home Assistant should connect to the backend's Z-Wave JS WebSocket server.
#
# To find a stable controller path, run:
#   ls -l /dev/serial/by-id/
# Then set ZWAVE_DEVICE in your real .env file.
name: zwave-ui

services:
  backend:
    image: zwavejs/zwave-js-ui:11.19.1
    container_name: zwave-ui-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8091}:8091"
    volumes:
      - ./store:/usr/src/app/store
    devices:
      # Only the backend owns the Z-Wave stick.
      - "${ZWAVE_DEVICE:-/dev/ttyACM0}:/dev/zwave"
    environment:
      TZ: ${TZ:-UTC}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}

  frontend:
    image: ghcr.io/surdy/zwave-ui-frontend:latest
    container_name: zwave-ui-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8092}:8080"
    environment:
      # Use the internal Compose service name, not the container_name.
      BACKEND_URL: "http://backend:8091"
    depends_on:
      - backend
