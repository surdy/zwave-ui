name: E2E

# Integration smoke test (issue #30): boots the upstream zwave-js-ui backend
# with the mock stick, serves the built frontend, and runs a thin Playwright
# smoke suite. It is heavier than the unit-test CI (it clones + installs the
# upstream backend and downloads a browser), but still completes in a few
# minutes, so we run it on PRs and main to gate merges. If it ever becomes too
# slow/flaky for every PR, narrow the `on:` triggers to `push: main` +
# `schedule:` — the job itself is unchanged.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pin the upstream backend to the same version the container image bundles.
  ZWAVE_JS_UI_REF: v11.19.1
  ZWAVE_JS_UI_DIR: ${{ github.workspace }}/.e2e-backend/zwave-js-ui

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Checkout upstream zwave-js-ui (mock backend)
        uses: actions/checkout@v4
        with:
          repository: zwave-js/zwave-js-ui
          ref: ${{ env.ZWAVE_JS_UI_REF }}
          path: .e2e-backend/zwave-js-ui

      - name: Install upstream backend deps
        working-directory: .e2e-backend/zwave-js-ui
        run: npm ci --no-audit --no-fund

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run integration smoke test
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
