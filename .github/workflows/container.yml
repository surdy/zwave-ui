name: Container

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/surdy/zwave-ui
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  frontend-image:
    name: Build standalone frontend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/surdy/zwave-ui-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      # On pull requests: build the standalone target, load it locally, and
      # smoke test that nginx starts and serves the SPA (no backend needed).
      - name: Build standalone image (PR smoke)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: standalone
          platforms: linux/amd64
          load: true
          push: false
          tags: zwave-ui-frontend:smoke

      - name: Smoke test the standalone image
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # Point at an unreachable backend: we only validate static serving and
          # that the rendered nginx config is valid (nginx exits on bad config).
          docker run -d --name zwave-ui-fe -e BACKEND_URL=http://127.0.0.1:9 -p 8092:8080 zwave-ui-frontend:smoke
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS -o /tmp/index.html http://localhost:8092/; then ok=1; break; fi
            if [ -z "$(docker ps -q -f name=zwave-ui-fe)" ]; then
              echo "Container exited early; logs:"; docker logs zwave-ui-fe; exit 1
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "Frontend did not serve within timeout; logs:"; docker logs zwave-ui-fe; exit 1
          fi
          grep -qi '<div id="app">' /tmp/index.html || { echo "Served HTML missing app root:"; cat /tmp/index.html; exit 1; }
          echo "Smoke test passed: SPA served and nginx config valid."
          docker rm -f zwave-ui-fe

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push standalone image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: standalone
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
